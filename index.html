<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Wisp</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bundle.css"></head>
<body data-backdrop="light"><main><input id="file" type="file" accept="video/*" hidden><p id="modeDescription" hidden></p><video-player><video-skin class="player" id="player" data-mode="ambient" aria-label="Wisp video player"><canvas id="ambient" width="160" height="90" aria-hidden="true"></canvas><div class="shade"></div><div class="heading chrome"><span id="modeLabel" hidden></span><span id="title" hidden>Catch me</span><button id="settingsButton" class="icon glass" aria-label="Player settings" aria-expanded="false" aria-controls="settings" title="Player settings">✧</button></div><video id="video" playsinline preload="auto" muted autoplay loop src="assets/chase.mp4" aria-label="Catch me"></video><aside id="settings" class="settings glass" hidden aria-label="Player settings"><div class="settings-head">Player settings<button id="closeSettings" aria-label="Close player settings" class="icon">×</button></div><button id="open" class="open">Open video <span>↗</span></button><button id="expandMode" hidden>Enter fullscreen</button><p class="settings-section">Mode</p><nav class="mode-picker" aria-label="Player mode">
<button data-mode="ambient" aria-pressed="true"><span>01</span> Ambient Fade</button>
</nav><div class="preview-tools"><label>Backdrop <select id="backdrop"><option value="dark">Charcoal</option><option value="light" selected>Pearl</option><option value="sand">Sand</option><option value="blue">Midnight blue</option></select></label><label>Scene <select id="scene"><optgroup label="Demo"><option value="chase" selected>Chase · kids cross the garden</option><option value="marble">Marble · walks edge to edge</option><option value="studio">Studio · people cross white</option><option value="desert">Desert · crosses right to left</option><option value="dog">Dog · crosses yellow</option></optgroup><optgroup label="Kids"><option value="beachgirl">Beach girl · runs to the camera</option><option value="balloons">Balloons · kids run across</option><option value="rocket">Rocket · boy runs up close</option></optgroup><optgroup label="Cinematic"><option value="redtop">Red top · face at the top edge</option><option value="boat">Boat · filmmaker, subjects both sides</option><option value="beachwalk">Beach walk · vertical, backlit</option><option value="haze">Haze · black and white</option></optgroup><optgroup label="Edge demos"><option value="camels">Camels · exit right</option><option value="balloon">Balloon · top-left corner</option><option value="sailboat">Sailboat · bottom edge</option><option value="paraglider">Paraglider · top-left</option><option value="paddler">Paddler · small, bottom-right</option></optgroup><optgroup label="Original"><option value="dream">Botanical · mixed light</option><option value="mountains">Mountains · bright</option><option value="ocean">Ocean · blue</option><option value="neon">Neon · dark</option><option value="clouds">Clouds · bright highlights</option><option value="sunset">Sunset · warm light</option><option value="forest">Forest · fine detail</option></optgroup></select></label></div><label>Edge softness <output id="softValue">42%</output><input id="softness" aria-label="Edge softness" type="range" min="0" max="100" value="42"></label><label>Atmosphere <output id="atmosValue">70%</output><input id="atmosphere" aria-label="Atmosphere" type="range" min="0" max="100" value="70"></label><label class="check"><input id="ambientToggle" type="checkbox" checked> Live ambient extension</label><label class="check"><input id="contentAware" type="checkbox" checked> Content-aware edges</label><label class="check"><input id="gpuFade" type="checkbox" checked> GPU fade, content-shaped (beta)</label><button id="reset" class="text-button">Reset appearance</button></aside>
<div id="status" class="status glass" role="status" aria-live="polite">Loading your dream…</div><div id="drop" hidden>Drop a video to make it yours</div>
</video-skin></video-player></main><script type="module" src="bundle.js"></script></body></html>
